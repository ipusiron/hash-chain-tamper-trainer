<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; connect-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Hash Chain Tamper Trainer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="chain-core.js" defer></script>
  <script src="samples.js" defer></script>
  <script src="messages.js" defer></script>
  <script src="learning-progress.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1 data-i18n="title"></h1>
    <p data-i18n="description"></p>
    <div class="language-row"><button id="lang-toggle" type="button" data-i18n="language"></button></div>
  </header>
  <noscript><p lang="ja">JavaScriptを有効にしてご利用ください。</p><p lang="en">Enable JavaScript to use this tool.</p></noscript>
  <main>
    <nav class="entries" role="tablist" data-i18n-label="tabs">
      <button id="tab-guide" type="button" role="tab" aria-selected="true" aria-controls="panel-guide" tabindex="0" data-i18n="tab.guide"></button>
      <button id="tab-free" type="button" role="tab" aria-selected="false" aria-controls="panel-free" tabindex="-1" data-i18n="tab.free"></button>
      <button id="tab-learn" type="button" role="tab" aria-selected="false" aria-controls="panel-learn" tabindex="-1" data-i18n="tab.learn"></button>
      <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" tabindex="-1" data-i18n="tab.settings"></button>
    </nav>
    <p id="announcement" role="status" aria-live="polite"></p>
    <p id="error" role="alert" class="warning"></p>
    <p id="learning-storage-warning" role="status" class="warning multiline" hidden></p>
    <section id="panel-guide" role="tabpanel" aria-labelledby="tab-guide">
      <div class="guide-progress-row"><span id="guide-counter"></span><progress id="guide-progress" max="7" value="1"></progress></div>
      <p id="guide-understood-count" class="understood-count" role="status"></p>
      <p id="understanding-note" class="muted" data-i18n="learning.manual"></p>
      <details id="guide-picker" class="step-picker"><summary data-i18n="guide.choose"></summary><ol id="guide-steps" class="guide-steps"></ol></details>
      <h2 id="guide-heading" tabindex="-1"></h2>
      <section id="guide-aim-section" class="guide-aim"><h3 data-i18n="guide.aim"></h3><p class="multiline" id="guide-aim"></p></section>
      <section id="guide-prerequisites" class="prerequisite"><h3 data-i18n="lesson.prerequisite"></h3><div id="guide-background"></div></section>
      <section id="guide-task-section"><h3 data-i18n="guide.task"></h3><p class="multiline" id="guide-task"></p>
      <p id="guide-prepared" class="muted" data-i18n="guide.prepared" hidden></p>
      <div id="guide-state" class="experiment-state" hidden></div>
      <div id="guide-prediction"></div>
      <div id="guide-options" class="check-options" hidden></div>
      <div class="actions"><button id="guide-action" class="primary"></button><button id="guide-build-reset" data-i18n="guide.build.reset" hidden></button><button id="guide-build-next" data-i18n="guide.build.nextStep" hidden></button><button id="guide-reset" data-i18n="resetTamper" hidden></button></div>
      <div id="guide-build-progress" hidden>
        <figure class="build-progress" aria-labelledby="guide-build-caption">
          <figcaption id="guide-build-caption"></figcaption>
          <ol id="guide-build-rows" class="build-rows"></ol>
        </figure>
        <p id="guide-build-status" class="build-status" role="status" aria-atomic="true"></p>
      </div>
      <button id="guide-overview-jump" class="overview-jump" type="button" data-i18n="overview.jump" hidden></button>
      </section>
      <section id="guide-observation-section" class="guide-observation"><h3 data-i18n="guide.now"></h3><div id="guide-now" aria-live="polite"></div>
          <div id="guide-meaning"></div>
    <section id="guide-position" aria-labelledby="guide-position-heading" hidden>
      <h4 id="guide-position-heading" tabindex="-1" data-i18n="position.title"></h4>
      <p data-i18n="position.intro" class="multiline"></p>
      <p class="diagram-reading" data-i18n="diagram.reading"></p>
      <p data-i18n="position.replay" class="multiline"></p>
      <div class="position-controls">
        <div class="position-stages" role="group" data-i18n-label="position.choose">
          <button id="position-stage-0" type="button" aria-pressed="true" data-i18n="position.stage.0"></button>
          <button id="position-stage-1" type="button" aria-pressed="false" data-i18n="position.stage.1"></button>
          <button id="position-stage-2" type="button" aria-pressed="false" data-i18n="position.stage.2"></button>
        </div>
        <label class="check-option"><input id="position-trailer" type="checkbox" checked><span data-i18n="position.trailerOption"></span></label>
        <button id="position-reset" type="button" data-i18n="position.reset"></button>
      </div>
      <p id="position-status" class="position-stage-note" role="status" aria-atomic="true"></p>
      <div id="position-cases" class="position-cases"></div>
      <p id="position-conclusion" class="visual-conclusion"></p>
      <p data-i18n="position.limit" class="muted"></p>
      <aside class="position-handoff"><p data-i18n="position.handoff" class="multiline"></p><button id="position-next" type="button" data-i18n="position.nextStep"></button></aside>
    </section>
          <div id="guide-visual"></div></section>
      <div id="guide-result"></div>
      <div id="guide-quiz" hidden>    <section id="panel-quiz" data-i18n-label="tab.quiz" hidden>
      <h2 data-i18n="tab.quiz"></h2>
      <label for="question-select" data-i18n="quiz.choose"></label><select id="question-select"></select>
      <p id="quiz-level" class="quiz-level"></p>
      <h3 id="quiz-prompt"></h3><div id="quiz-choices" class="quiz-choices"></div>
      <div id="quiz-feedback" aria-live="polite"></div>
      <div class="actions"><button id="quiz-related" data-i18n="quiz.related"></button><button id="quiz-reset" data-i18n="quiz.reset"></button></div>
    </section></div>
      <section id="guide-mechanism" class="guide-mechanism" tabindex="-1" aria-labelledby="guide-mechanism-heading"><h3 id="guide-mechanism-heading" data-i18n="guide.mechanism"></h3><button id="guide-back-to-quiz" data-i18n="quiz.back" hidden></button><div id="guide-explanation"></div></section>
      <aside id="guide-takeaway" class="takeaway" hidden><h3 data-i18n="guide.learned"></h3><p class="multiline" id="guide-understood"></p></aside>
      <div class="guide-navigation"><button id="guide-back" data-i18n="guide.back"></button><button id="guide-next" data-i18n="guide.next"></button></div>
    </section>
    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <h2 id="learning-settings-heading" tabindex="-1" data-i18n="settings.title"></h2>
      <p id="settings-understood-count" class="understood-count"></p>
      <p id="learning-legacy" class="privacy multiline" hidden></p>
      <label class="check-option"><input id="learning-save" type="checkbox" aria-describedby="learning-save-note"><span data-i18n="learning.save"></span></label>
      <p id="learning-save-note" data-i18n="learning.saveNote"></p>
      <p id="learning-save-status" class="muted"></p>
      <section aria-labelledby="learning-reset-heading">
        <h3 id="learning-reset-heading" data-i18n="learning.resetHeading"></h3>
        <p data-i18n="learning.resetNote"></p>
        <button id="learning-reset" type="button" data-i18n="learning.reset"></button>
        <div id="learning-reset-confirm" class="reset-confirm" role="group" aria-labelledby="learning-reset-question" hidden>
          <p id="learning-reset-question"></p>
          <div class="actions">
            <button id="learning-reset-cancel" type="button" data-i18n="learning.cancel"></button>
            <button id="learning-reset-apply" type="button" data-i18n="learning.confirm"></button>
          </div>
        </div>
      </section>
      <p id="learning-message" role="status"></p>
    </section>
    <section id="panel-free" role="tabpanel" aria-labelledby="tab-free" hidden>
      <h2 data-i18n="tab.free"></h2>
    <nav class="free-tabs" role="tablist" data-i18n-label="free.sections">
      <button id="tab-build" type="button" role="tab" aria-selected="true" aria-controls="panel-build" data-i18n="tab.build"></button>
      <button id="tab-tamper" type="button" role="tab" aria-selected="false" tabindex="-1" aria-controls="panel-tamper" data-i18n="tab.tamper"></button>
      <button id="tab-protect" type="button" role="tab" aria-selected="false" tabindex="-1" aria-controls="panel-protect" data-i18n="tab.protect"></button>
    </nav>
    <div id="settings" class="settings">
      <div><label for="sample-select" data-i18n="sample"></label><select id="sample-select"></select></div>
      <div><label for="header-select" data-i18n="includeHeader"></label><select id="header-select"><option value="yes" data-i18n="yes"></option><option value="no" data-i18n="no"></option></select></div>
      <div><label for="trailer-select" data-i18n="trailer"></label><select id="trailer-select"><option value="yes" data-i18n="yes"></option><option value="no" data-i18n="no"></option></select></div>
    </div>
    <p id="setup-note" class="muted" data-i18n="setupNote"></p>
    <section id="panel-build" role="tabpanel" aria-labelledby="tab-build">
      <h2 data-i18n="build.title"></h2><p data-i18n="build.intro"></p>
      <div class="actions"><button id="step-start" data-i18n="stepStart"></button><button id="step-next" data-i18n="stepNext"></button><button id="step-all" data-i18n="stepAll"></button></div>
      <p id="progress" aria-live="polite"></p>
      <div id="build-chain"></div>
      <h3 data-i18n="addTitle"></h3><p id="fields-note" class="muted" data-i18n="fieldsNote"></p>
      <div id="add-fields" class="field-grid"></div><button id="add-row" data-i18n="add"></button>
    </section>
    <section id="panel-tamper" role="tabpanel" aria-labelledby="tab-tamper" hidden>
      <h2 data-i18n="tamper.title"></h2><p data-i18n="tamper.intro"></p>
      <div class="field-grid">
        <div><label for="operation" data-i18n="operation"></label><select id="operation"></select></div>
        <div><label for="target-row" data-i18n="targetRow"></label><select id="target-row"></select></div>
        <div><label for="target-column" data-i18n="column"></label><select id="target-column"></select></div>
        <div><label for="new-value" data-i18n="newValue"></label><input id="new-value" value="09:06" maxlength="64" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="tamper-fields-note"></div>
        <div><label for="cut-count" data-i18n="cutCount"></label><input id="cut-count" type="number" value="2" min="1" max="8" autocomplete="off"></div>
      </div>
      <p id="tamper-fields-note" class="muted" data-i18n="fieldsNote"></p>
      <div class="actions"><button id="apply-tamper" data-i18n="applyTamper"></button><button id="verify" data-i18n="verify"></button><button id="reset-tamper" data-i18n="resetTamper"></button></div>
      <div id="tamper-result" aria-live="polite"></div><p class="muted" data-i18n="noInference"></p>
      <p data-i18n="clarity.freeReset" class="muted"></p>
      <div id="free-comparison"></div>
      <details class="learning-details"><summary data-i18n="clarity.rows"></summary><div id="tampered-chain"></div></details>
    </section>
    <section id="panel-protect" role="tabpanel" aria-labelledby="tab-protect" hidden>
      <h2 data-i18n="protect.title"></h2><p data-i18n="rechainIntro"></p>
      <button id="rechain" data-i18n="rechain"></button><div id="rechain-result" aria-live="polite"></div>
      <p class="privacy" data-i18n="coreLesson"></p>
      <h3 data-i18n="matrixTitle"></h3><p data-i18n="matrixIntro"></p>
      <div id="protection-options" class="check-options"></div>
      <button id="calculate-matrix" data-i18n="calculateMatrix"></button>
      <div id="matrix"></div>
      <details id="experiment-details"><summary data-i18n="details"></summary>
        <label for="role-select" data-i18n="chooseRole"></label>
        <select id="role-select"><option value="0" data-i18n="role.outsider"></option><option value="1" data-i18n="role.recorder"></option></select>
        <div id="experiment-trace"></div>
      </details>
      <p data-i18n="checkpointNote"></p><p data-i18n="hmacNote"></p><p data-i18n="timeNote"></p><p class="privacy" data-i18n="simulationNote"></p>
    </section>
    </section>
    <section id="panel-learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
      <h2 data-i18n="tab.learn"></h2>
      <label for="lesson-select" data-i18n="lesson.choose"></label><select id="lesson-select"></select>
      <div class="actions"><button id="lesson-previous" data-i18n="lesson.previous"></button><button id="lesson-next" data-i18n="lesson.next"></button><button id="back-to-quiz" data-i18n="quiz.back" hidden></button></div>
      <article id="lesson-content" tabindex="-1"></article>
      <button id="lesson-try" data-i18n="lesson.try"></button><button id="lesson-quiz" data-i18n="guide.openQuiz"></button>
    </section>

  </main>
  <footer><p data-i18n="privacy"></p><p data-i18n="author"></p><a href="https://github.com/ipusiron/hash-chain-tamper-trainer" target="_blank" rel="noopener noreferrer" data-i18n="repository"></a></footer>
</body>
</html>
